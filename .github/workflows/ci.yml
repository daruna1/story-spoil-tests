name: CI Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 7.0.x

      - name: Restore dependencies
        run: dotnet restore StorySpoiler.sln

      - name: Build solution
        run: dotnet build StorySpoiler.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test StorySpoiler.sln --no-build --verbosity normal